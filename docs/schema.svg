<text x="52" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#16202c">id<tspan fill="#8a96a3">  INTEGER</tspan><tspan fill="#5b6875">  PK</tspan></text>
