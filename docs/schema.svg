<text x="52" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16202c">tautomerHash<tspan fill="#8a96a3">  INTEGER</tspan><tspan fill="#5b6875">  NN</tspan></text>
